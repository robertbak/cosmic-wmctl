name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libfreetype-dev libfontconfig1-dev

      - name: Format
        run: cargo fmt -p cosmic-wmctl -p cosmic-wmctl-config -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release --workspace
