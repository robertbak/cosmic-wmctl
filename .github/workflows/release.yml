name: Release

on:
  push:
    tags:
      - "v*"

# Required for softprops/action-gh-release to create the release and upload
# artifacts. The repo default is read-only, which fails with HTTP 403.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libfreetype-dev libfontconfig1-dev

      - name: Build
        run: cargo build --release --workspace

      - name: Package binaries
        run: |
          mkdir -p package/bin
          install -m755 target/release/cosmic-wmctl package/bin/
          install -m755 target/release/cosmic-wmctl-config package/bin/
          tar -czf cosmic-wmctl-${{ github.ref_name }}-linux-x86_64.tar.gz -C package bin

      - name: Package source
        run: git archive --prefix=cosmic-wmctl-${{ github.ref_name }}/ HEAD | gzip > cosmic-wmctl-${{ github.ref_name }}.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cosmic-wmctl-${{ github.ref_name }}-linux-x86_64.tar.gz
            cosmic-wmctl-${{ github.ref_name }}.tar.gz
