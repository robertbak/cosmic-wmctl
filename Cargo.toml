[package]
name = "cosmic-wmctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "GPL-3.0-only"
description = "Small CLI for managing COSMIC windows and workspaces"
publish = false

[workspace]
members = [
    "vendor/cosmic-protocols",
    "vendor/cosmic-protocols/client-toolkit",
    "cosmic-wmctl-config",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
cosmic-client-toolkit = { path = "vendor/cosmic-protocols/client-toolkit" }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
sctk = { package = "smithay-client-toolkit", version = "0.21.1" }
toml = "1"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
