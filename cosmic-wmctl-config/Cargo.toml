[package]
name = "cosmic-wmctl-config"
version = "0.2.1"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "COSMIC GUI for configuring cosmic-wmctl window placement rules"
publish = false

[dependencies]
cosmic-wmctl = { path = ".." }
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["winit", "tokio", "a11y", "wayland"] }
toml = "1"
